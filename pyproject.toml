[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astra-indexator"
version = "0.1.0"
description = "AstraIndexator document indexing pipeline"
requires-python = ">=3.11"
dependencies = [
  "SQLAlchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "testcontainers[postgres]>=4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/astra_indexator"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
