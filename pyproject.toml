[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astra-indexator"
version = "0.1.0"
description = "AstraIndexator document indexing pipeline"
requires-python = ">=3.12"
dependencies = [
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.27,<1",
  "Pillow>=10,<13",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pdfplumber>=0.11,<1",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "python-pptx>=1.0,<2",
  "beautifulsoup4>=4.12,<5",
  "lxml>=5,<7",
  "odfpy>=1.4,<2",
  "striprtf>=0.0.28,<1",
  "EbookLib>=0.18,<1",
  "regex>=2024.11,<2027",
]

[project.optional-dependencies]
ocr = [
  "paddleocr>=3,<4",
  "pypdfium2>=4,<5",
]
ocr-onnx-cpu = [
  "paddleocr>=3.5,<4",
  "pypdfium2>=4,<5",
  "onnxruntime>=1.23,<2",
]
ocr-onnx-gpu = [
  "paddleocr>=3.5,<4",
  "pypdfium2>=4,<5",
  "onnxruntime-gpu>=1.23,<2",
]
linguistics = [
  "PyICU>=2.13,<3",
]
test = [
  "pytest>=8,<9",
  "testcontainers[postgres]>=4,<5",
  "reportlab>=4,<5",
  "pypdfium2>=4,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/astra_indexator"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
