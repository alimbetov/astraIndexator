[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astra-indexator"
version = "0.1.0"
description = "AstraIndexator document indexing pipeline"
requires-python = ">=3.12"
dependencies = [
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.27,<1",
  "Pillow>=10,<13",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pdfplumber>=0.11,<1",
  "python-docx>=1.1,<2",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "testcontainers[postgres]>=4,<5",
  "reportlab>=4,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/astra_indexator"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
