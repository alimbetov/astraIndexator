name: P1-2 Temporary Autofix

on:
  push:
    branches: [fix/p1-2-ci-green]

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p1-2-ci-green
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Apply Ruff safe fixes and formatting
        run: |
          ruff check --fix src tests
          ruff format src tests
      - name: Commit mechanical cleanup
        run: |
          if git diff --quiet; then
            echo 'No autofix changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git commit -m 'style: apply P1-2 Ruff cleanup'
          git push origin HEAD:fix/p1-2-ci-green
